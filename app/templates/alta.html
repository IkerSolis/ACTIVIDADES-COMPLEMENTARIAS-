{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alta - Servicios</title>
    
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        .form-container {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-submit {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .error-messages {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div id="app">
    </div>
    
    <div class="container">
        <div class="form-container">
            <h2>Agregar Nuevo Servicio</h2>
            
            {% if messages %}
            <div class="error-messages">
                <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}

            <form action="/alta/" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="nombre">Nombre del Servicio:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Desarrollo Web">
                </div>
                <div class="form-group">
                    <label for="desc">Descripción:</label>
                    <textarea id="desc" name="desc" rows="3" placeholder="Ej. Creación de sitios web modernos"></textarea>
                </div>
                <div class="form-group">
                    <label for="precio">Precio ($):</label>
                    <input type="number" id="precio" name="precio" step="0.01" placeholder="Ej. 1500.50">
                </div>
                <button type="submit" class="btn-submit">Guardar Servicio</button>
            </form>
        </div>
    </div>

    <div id="footer-container">
    </div>
        
    <script src="{% static 'js/script.js' %}"></script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const app = document.getElementById("app");
        app.appendChild(crearHeader());
        
        const footerContainer = document.getElementById("footer-container");
        footerContainer.appendChild(crearFooter());
    });
    </script>
</body>
</html>
